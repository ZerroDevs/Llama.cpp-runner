<!-- ========================================== -->
<!-- MODAL: GLOBAL COMMAND PALETTE (CTRL+K)     -->
<!-- ========================================== -->
<div id="modal-cmd-palette" class="hidden fixed inset-0 bg-black/70 backdrop-blur-xs z-50 flex items-start justify-center pt-20 px-4 animate-in fade-in duration-150">
  <div class="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden flex flex-col max-h-[70vh]">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-[var(--border)] bg-[var(--bg-elevated)]">
      <i data-lucide="command" class="w-4 h-4 text-indigo-400"></i>
      <input id="cmd-input" placeholder="Type a command or search tabs..." class="bg-transparent text-xs w-full text-[var(--text-primary)] outline-none" />
      <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[var(--bg-base)] border border-[var(--border)] text-[var(--text-muted)]">ESC</span>
    </div>
    <div id="cmd-list" class="overflow-y-auto p-2 flex flex-col gap-1 max-h-80"></div>
  </div>
</div>
