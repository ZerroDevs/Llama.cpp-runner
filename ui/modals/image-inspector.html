<!-- ========================================== -->
<!-- MODAL: IMAGE METADATA CHUNK INSPECTOR      -->
<!-- ========================================== -->
<div id="modal-image-inspector" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 md:p-6 animate-in fade-in duration-150">
  <div id="inspector-dialog" class="bg-[var(--bg-card)] border border-[var(--border)] rounded-3xl shadow-2xl max-w-6xl w-full max-h-[90vh] h-[85vh] flex flex-col overflow-hidden transition-all duration-200" onclick="event.stopPropagation()">
    
    <!-- Top Action Toolbar -->
    <div class="px-5 py-3 border-b border-[var(--border)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-3 shrink-0">
      <div class="flex items-center gap-2">
        <i data-lucide="sparkles" class="w-4 h-4 text-emerald-400"></i>
        <span class="text-xs font-bold uppercase tracking-wider font-mono text-[var(--text-primary)]">Image Inspector & Generation Specs</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- Fullscreen Button -->
        <button id="btn-modal-fullscreen" class="px-3 py-1.5 rounded-xl bg-[var(--bg-base)] border border-[var(--border)] text-xs font-medium text-[var(--text-secondary)] hover:text-white flex items-center gap-1.5 transition-colors" title="Toggle Fullscreen Mode">
          <i data-lucide="maximize" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span class="hidden sm:inline">Fullscreen</span>
        </button>

        <!-- Open Containing Folder Button -->
        <button id="btn-modal-folder" class="px-3 py-1.5 rounded-xl bg-[var(--bg-base)] border border-[var(--border)] text-xs font-medium text-[var(--text-secondary)] hover:text-white flex items-center gap-1.5 transition-colors" title="Reveal in File Explorer">
          <i data-lucide="folder-open" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span class="hidden sm:inline">Open Folder</span>
        </button>

        <!-- Copy Image Button -->
        <button id="btn-modal-copy-img" class="px-3 py-1.5 rounded-xl bg-[var(--bg-base)] border border-[var(--border)] text-xs font-medium text-[var(--text-secondary)] hover:text-white flex items-center gap-1.5 transition-colors" title="Copy Image to Clipboard">
          <i data-lucide="copy" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span class="hidden sm:inline">Copy Image</span>
        </button>

        <!-- Delete Image Button -->
        <button id="btn-modal-delete-img" class="px-3 py-1.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-xs font-semibold text-rose-400 hover:bg-rose-500/25 flex items-center gap-1.5 transition-colors" title="Delete Image from Disk">
          <i data-lucide="trash-2" class="w-3.5 h-3.5 text-rose-400"></i>
          <span class="hidden sm:inline">Delete</span>
        </button>

        <div class="w-px h-5 bg-[var(--border)] mx-1"></div>

        <!-- Close Modal -->
        <button id="btn-close-inspector" class="p-1.5 rounded-xl hover:bg-[var(--bg-base)] text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-colors" title="Close">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Main Content Area: Viewport + Spec Sheet -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">
      
      <!-- Interactive Zoom/Pan Viewport -->
      <div id="inspector-img-viewport" class="flex-1 bg-black/95 relative overflow-hidden flex items-center justify-center select-none group/vp">
        
        <!-- Exit Fullscreen Button (Top Right Floating) -->
        <button id="btn-exit-fullscreen" class="hidden absolute top-5 right-5 z-50 bg-black/80 hover:bg-black/95 text-white px-4 py-2 rounded-full border border-white/20 shadow-2xl backdrop-blur-md flex items-center gap-2 transition-all cursor-pointer">
          <i data-lucide="minimize" class="w-4 h-4 text-cyan-400"></i>
          <span class="text-xs font-bold font-mono">Exit Fullscreen</span>
        </button>

        <!-- Image Container for Transform (Pan & Zoom) -->
        <div id="inspector-img-container" class="w-full h-full flex items-center justify-center origin-center transition-transform duration-75 cursor-grab">
          <img id="inspector-img" src="" alt="preview" class="max-h-full max-w-full object-contain rounded-xl shadow-2xl pointer-events-none select-none" />
        </div>

        <!-- Floating Zoom & Pan Control Pill (Bottom Center) -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-30 bg-black/75 backdrop-blur-md border border-white/15 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-2xl opacity-75 hover:opacity-100 transition-opacity">
          <button id="btn-zoom-out" class="p-1 hover:text-cyan-400 text-white/80 transition-colors" title="Zoom Out (Mouse Wheel Down)">
            <i data-lucide="minus" class="w-3.5 h-3.5"></i>
          </button>
          <span id="lbl-zoom-level" class="text-[11px] font-mono text-cyan-400 font-bold w-12 text-center select-none">100%</span>
          <button id="btn-zoom-in" class="p-1 hover:text-cyan-400 text-white/80 transition-colors" title="Zoom In (Mouse Wheel Up)">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          </button>
          <div class="w-px h-3.5 bg-white/20 mx-0.5"></div>
          <button id="btn-zoom-reset" class="px-2 py-0.5 rounded-md hover:bg-white/10 text-[10px] font-mono text-white/80 hover:text-white transition-colors" title="Reset Zoom & Pan">
            Reset
          </button>
        </div>

        <!-- Zoom Hint -->
        <div class="absolute bottom-4 right-4 z-20 text-[10px] font-mono text-white/40 pointer-events-none hidden lg:block">
          Scroll to zoom • Drag to pan • Double-click to reset
        </div>
      </div>

      <!-- Right Metadata Spec Sheet Panel -->
      <div class="w-full md:w-96 lg:w-[420px] border-t md:border-t-0 md:border-l border-[var(--border)] p-5 overflow-y-auto space-y-4 bg-[var(--bg-card)] shrink-0">
        <div id="inspector-metadata-entries" class="space-y-4 text-xs font-mono"></div>
      </div>
    </div>
  </div>
</div>
