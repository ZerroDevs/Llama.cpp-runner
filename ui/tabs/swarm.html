<!-- ========================================== -->
<!-- TAB 8: SWARMUI STUDIO & IMAGE GALLERY      -->
<!-- ========================================== -->
<section id="tab-swarm" class="tab-pane p-6 space-y-4 max-w-5xl mx-auto">
  <!-- Swarm Launcher Config -->
  <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-4">
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="palette" class="w-4 h-4 text-fuchsia-400"></i>
        <span class="text-xs font-bold uppercase tracking-wider font-mono text-[var(--text-primary)]">SwarmUI Runner Controls</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-toggle-swarm" class="px-3.5 py-1.5 rounded-xl bg-[var(--bg-elevated)] border border-[var(--border)] text-xs font-semibold text-[var(--text-secondary)] hover:text-cyan-400 transition-colors flex items-center gap-1.5">
          <i data-lucide="play" class="w-3.5 h-3.5"></i>
          <span id="lbl-swarm-btn-text">Start SwarmUI</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
      <div class="md:col-span-2 space-y-1">
        <label for="input-swarm-path" class="text-[11px] font-mono text-[var(--text-muted)] uppercase">SwarmUI Launcher (.bat or .exe)</label>
        <div class="flex items-center gap-2">
          <input id="input-swarm-path" placeholder="Path to launch-windows.bat..." class="flex-1 bg-[var(--bg-input)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-mono outline-none truncate" />
          <button id="btn-browse-swarm" class="p-2 rounded-xl border border-[var(--border)] hover:bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
            <i data-lucide="folder-open" class="w-4 h-4 text-cyan-400"></i>
          </button>
        </div>
      </div>

      <div class="space-y-1">
        <label for="input-swarm-port" class="text-[11px] font-mono text-[var(--text-muted)] uppercase">SwarmUI Port</label>
        <input id="input-swarm-port" type="number" value="7801" class="w-full bg-[var(--bg-input)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-mono outline-none" />
      </div>
    </div>

    <!-- SwarmUI Diffusion Models Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs pt-3 border-t border-[var(--border)]">
      <div class="md:col-span-2 space-y-1">
        <div class="flex items-center justify-between">
          <label for="input-swarm-models-path" class="text-[11px] font-mono text-[var(--text-muted)] uppercase">SwarmUI Models Folder</label>
          <span class="text-[10px] text-fuchsia-400 font-mono">e.g. SwarmUI\Models or diffusion_models</span>
        </div>
        <div class="flex items-center gap-2">
          <input id="input-swarm-models-path" placeholder="Path to Models folder (e.g. E:\GE Ui\SwarmUI\Models)..." class="flex-1 bg-[var(--bg-input)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-mono outline-none truncate" />
          <button id="btn-browse-swarm-models-path" class="p-2 rounded-xl border border-[var(--border)] hover:bg-[var(--bg-elevated)] text-[var(--text-secondary)]" title="Browse Models Directory">
            <i data-lucide="folder-open" class="w-4 h-4 text-cyan-400"></i>
          </button>
          <button id="btn-rescan-swarm-models" class="p-2 rounded-xl border border-[var(--border)] hover:bg-[var(--bg-elevated)] text-[var(--text-secondary)]" title="Rescan Models Folder">
            <i data-lucide="refresh-cw" class="w-4 h-4 text-emerald-400"></i>
          </button>
        </div>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between">
          <label for="select-swarm-model" class="text-[11px] font-mono text-[var(--text-muted)] uppercase">Diffusion Model</label>
          <span id="swarm-model-count-badge" class="text-[10px] text-emerald-400 font-mono font-bold">1 found</span>
        </div>
        <select id="select-swarm-model" class="w-full bg-[var(--bg-elevated)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-mono text-[var(--text-primary)] outline-none cursor-pointer">
          <option value="qwen-image-2.1-UC-Q6_K.gguf">qwen-image-2.1-UC-Q6_K.gguf (Default)</option>
        </select>
      </div>
    </div>

    <!-- Active Swarm Model Override / Alias -->
    <div class="flex items-center gap-2 text-xs pt-1">
      <span class="text-[11px] font-mono text-[var(--text-muted)]">Active Model:</span>
      <input id="input-swarm-model-name" placeholder="Model name (e.g. qwen-image-2.1-UC-Q6_K.gguf, Qwen21)" class="flex-1 bg-[var(--bg-input)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-xs font-mono text-cyan-400 outline-none" />
      <button id="btn-save-swarm-model" class="px-3 py-1 rounded-lg bg-[var(--brand)] hover:bg-[var(--brand-hover)] text-black font-semibold text-xs transition-colors cursor-pointer shadow-xs">
        Save Model
      </button>
    </div>

    <!-- Swarm Launch Mode & Browser Toggle -->
    <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-[var(--border)]">
      <label class="flex items-center gap-2 cursor-pointer select-none text-xs text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors">
        <input type="checkbox" id="check-swarm-open-browser" class="w-4 h-4 rounded accent-[var(--brand)] cursor-pointer" />
        <span>Open in Web Browser on Launch</span>
      </label>
      <button id="btn-open-swarm-web" class="px-3.5 py-1.5 rounded-xl bg-[var(--bg-elevated)] border border-[var(--border)] text-xs text-[var(--text-secondary)] hover:text-cyan-400 flex items-center gap-1.5 transition-colors" title="Open SwarmUI in default browser">
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span>Open Swarm Web</span>
      </button>
    </div>
  </div>

  <!-- Swarm Generation Parameters (Width, Height, Steps, CFG Scale) -->
  <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-4">
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="sliders" class="w-4 h-4 text-cyan-400"></i>
        <span class="text-xs font-bold uppercase tracking-wider font-mono text-[var(--text-primary)]">Generation Parameters</span>
      </div>
      <span class="text-[11px] font-mono text-[var(--text-muted)]">Defaults for SwarmUI Studio</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Width -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs font-medium">
          <label for="cfg-swarm_width" class="text-[var(--text-secondary)] flex items-center gap-1.5">
            <span>Width</span>
            <span class="text-[10px] font-mono text-[var(--text-muted)]">(px)</span>
          </label>
          <span id="val-swarm_width" class="font-mono text-xs text-cyan-400 font-bold bg-[var(--bg-elevated)] px-2 py-0.5 rounded-md border border-[var(--border)]">1024</span>
        </div>
        <input type="range" id="cfg-swarm_width" min="256" max="2048" step="64" value="1024" class="w-full accent-[var(--brand)] cursor-pointer" />
      </div>

      <!-- Height -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs font-medium">
          <label for="cfg-swarm_height" class="text-[var(--text-secondary)] flex items-center gap-1.5">
            <span>Height</span>
            <span class="text-[10px] font-mono text-[var(--text-muted)]">(px)</span>
          </label>
          <span id="val-swarm_height" class="font-mono text-xs text-cyan-400 font-bold bg-[var(--bg-elevated)] px-2 py-0.5 rounded-md border border-[var(--border)]">1024</span>
        </div>
        <input type="range" id="cfg-swarm_height" min="256" max="2048" step="64" value="1024" class="w-full accent-[var(--brand)] cursor-pointer" />
      </div>

      <!-- Generation Steps -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs font-medium">
          <label for="cfg-swarm_steps" class="text-[var(--text-secondary)] flex items-center gap-1.5">
            <span>Generation Steps</span>
            <span class="text-[10px] font-mono text-[var(--text-muted)]">(0 - 50)</span>
          </label>
          <span id="val-swarm_steps" class="font-mono text-xs text-emerald-400 font-bold bg-[var(--bg-elevated)] px-2 py-0.5 rounded-md border border-[var(--border)]">25</span>
        </div>
        <input type="range" id="cfg-swarm_steps" min="0" max="50" step="1" value="25" class="w-full accent-[var(--brand)] cursor-pointer" />
      </div>

      <!-- CFG Scale -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs font-medium">
          <label for="cfg-swarm_cfg" class="text-[var(--text-secondary)] flex items-center gap-1.5">
            <span>CFG Scale</span>
            <span class="text-[10px] font-mono text-[var(--text-muted)]">(0 - 20)</span>
          </label>
          <span id="val-swarm_cfg" class="font-mono text-xs text-amber-400 font-bold bg-[var(--bg-elevated)] px-2 py-0.5 rounded-md border border-[var(--border)]">3.5</span>
        </div>
        <input type="range" id="cfg-swarm_cfg" min="0" max="20" step="0.1" value="3.5" class="w-full accent-[var(--brand)] cursor-pointer" />
      </div>
    </div>
  </div>

  <!-- Gallery Toolbar -->
  <div class="p-4 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-3">
    <div class="flex items-center justify-between gap-3">
      <div class="flex-1 flex items-center gap-2 bg-[var(--bg-input)] border border-[var(--border)] rounded-xl px-3 py-1.5">
        <i data-lucide="search" class="w-4 h-4 text-[var(--text-muted)]"></i>
        <input id="input-gallery-search" placeholder="Search prompts or folders..." class="bg-transparent text-xs w-full text-[var(--text-primary)] outline-none" />
      </div>

      <!-- PRIMARY DROPDOWN 5: Gallery Folder Dropdown (Preserved!) -->
      <select id="select-gallery-folder" class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-xl px-3 py-1.5 text-xs text-[var(--text-primary)] outline-none font-mono cursor-pointer">
        <option value="all">📁 All Date Folders</option>
      </select>

      <button id="btn-refresh-gallery" class="p-2 rounded-xl border border-[var(--border)] hover:bg-[var(--bg-elevated)] text-[var(--text-secondary)]" title="Refresh gallery">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>

      <button id="btn-gallery-select-mode" class="px-3 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--bg-elevated)] text-xs font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors">
        Select Mode
      </button>
    </div>

    <!-- Multi-select Action Bar -->
    <div id="gallery-bulk-actions" class="hidden items-center justify-between pt-2 border-t border-[var(--border)] text-xs">
      <span id="gallery-selected-count" class="font-mono text-[var(--text-muted)]">0 selected</span>
      <div class="flex items-center gap-2">
        <button id="btn-gallery-webhook" class="px-3 py-1 rounded-lg bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 text-xs font-semibold hover:bg-indigo-500/25">Send to Discord</button>
        <button id="btn-gallery-censor" class="px-2.5 py-1 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] text-[var(--text-secondary)]">Censor Blur</button>
        <button id="btn-gallery-uncensor" class="px-2.5 py-1 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] text-[var(--text-secondary)]">Uncensor</button>
        <button id="btn-gallery-delete" class="px-3 py-1 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs font-semibold hover:bg-rose-500/25">Delete</button>
      </div>
    </div>
  </div>

  <!-- Gallery Grid -->
  <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
</section>
