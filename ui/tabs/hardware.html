<!-- ========================================== -->
<!-- TAB 5: HARDWARE MONITOR & MATRIX           -->
<!-- ========================================== -->
<section id="tab-hardware" class="tab-pane p-6 space-y-4 max-w-5xl mx-auto">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <!-- VRAM Card -->
    <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-[var(--text-primary)] uppercase tracking-wider font-mono">Dedicated GPU VRAM</span>
        <span id="mat-vram-pct" class="font-mono text-xs font-bold text-emerald-400">0%</span>
      </div>
      <div class="w-full h-2 bg-[var(--bg-elevated)] rounded-full overflow-hidden border border-[var(--border)]">
        <div id="mat-vram-bar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="flex items-center justify-between text-[11px] font-mono text-[var(--text-muted)]">
        <span id="mat-vram-used">0.0 GB used</span>
        <span id="mat-vram-total">0.0 GB total</span>
      </div>
    </div>

    <!-- System RAM Card -->
    <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-[var(--text-primary)] uppercase tracking-wider font-mono">System Memory (RAM)</span>
        <span id="mat-ram-pct" class="font-mono text-xs font-bold text-cyan-400">0%</span>
      </div>
      <div class="w-full h-2 bg-[var(--bg-elevated)] rounded-full overflow-hidden border border-[var(--border)]">
        <div id="mat-ram-bar" class="h-full bg-cyan-500 transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="flex items-center justify-between text-[11px] font-mono text-[var(--text-muted)]">
        <span id="mat-ram-used">0.0 GB used</span>
        <span id="mat-ram-total">0.0 GB total</span>
      </div>
    </div>

    <!-- CPU & Temperature Card -->
    <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-[var(--text-primary)] uppercase tracking-wider font-mono">Processor & Temp</span>
        <span id="mat-gpu-temp" class="font-mono text-xs font-bold text-amber-400">-- °C</span>
      </div>
      <div class="w-full h-2 bg-[var(--bg-elevated)] rounded-full overflow-hidden border border-[var(--border)]">
        <div id="mat-cpu-bar" class="h-full bg-amber-500 transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="flex items-center justify-between text-[11px] font-mono text-[var(--text-muted)]">
        <span id="mat-cpu-pct">CPU: 0%</span>
        <span id="mat-gpu-name" class="truncate max-w-[120px]">GPU</span>
      </div>
    </div>
  </div>

  <!-- VRAM Layer Estimator -->
  <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-4">
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="calculator" class="w-4 h-4 text-indigo-400"></i>
        <span class="text-xs font-bold uppercase tracking-wider font-mono text-[var(--text-primary)]">VRAM & Layer Offload Estimator</span>
      </div>
      <button id="btn-calc-vram" class="px-3.5 py-1.5 rounded-xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 hover:bg-indigo-500/25 text-xs font-medium transition-colors">
        Calculate VRAM
      </button>
    </div>

    <div id="vram-calc-output" class="hidden p-3 bg-[var(--bg-elevated)] border border-indigo-500/30 rounded-xl flex items-center justify-between text-xs font-mono"></div>
  </div>
</section>
