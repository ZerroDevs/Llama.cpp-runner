<section id="tab-tuning" class="tab-pane p-6 space-y-4 max-w-5xl mx-auto">
  <div class="p-5 rounded-2xl bg-[var(--bg-card)] border border-[var(--border)] space-y-4">
    <div class="flex items-center gap-2 border-b border-[var(--border)] pb-3">
      <i data-lucide="sliders-horizontal" class="w-4 h-4 text-teal-400"></i>
      <span class="text-xs font-bold uppercase tracking-wider font-mono text-[var(--text-primary)]">Speculative Decoding & Tuning</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
      <div class="space-y-1.5">
        <label for="input-draft-model" class="font-semibold text-[var(--text-primary)]">Speculative Draft Model (--draft-model)</label>
        <input id="input-draft-model" placeholder="Path to smaller draft GGUF model..." class="w-full bg-[var(--bg-input)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-mono outline-none" />
      </div>

      <div class="space-y-1.5">
        <label for="input-draft-max" class="font-semibold text-[var(--text-primary)]">Draft Max Tokens (--draft-max)</label>
        <input id="input-draft-max" type="number" value="16" class="w-full bg-[var(--bg-input)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-mono outline-none" />
      </div>
    </div>
  </div>
</section>
