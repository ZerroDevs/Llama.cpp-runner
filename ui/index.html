<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llama Server Control V1</title>
  
  <!-- Typography & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/modals.css" />
</head>
<body class="bg-[var(--bg-base)] text-[var(--text-primary)] h-screen flex flex-col overflow-hidden font-sans select-none">

  <!-- Top Global Header -->
  <header class="h-14 border-b border-[var(--border)] bg-[var(--bg-card)] flex items-center justify-between px-5 shrink-0 z-20">
    <div class="flex items-center gap-3">
      <!-- App Brand Logo -->
      <div class="flex items-center gap-2.5">
        <img src="images/Logo-nobg.png" alt="Logo" class="w-8 h-8 object-contain" onerror="this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');" />
        <div id="logo-fallback" class="hidden w-8 h-8 rounded-lg bg-[var(--brand)] text-black flex items-center justify-center font-bold text-sm">🦙</div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm tracking-tight text-[var(--text-primary)]">LLAMA SERVER CONTROL</span>
            <span class="text-[9px] font-mono uppercase px-1.5 py-0.5 rounded bg-[var(--brand-muted)] text-[var(--brand)] border border-[var(--brand)]/20 font-semibold">V1 NATIVE</span>
          </div>
          <div class="text-[10px] text-[var(--text-muted)] font-mono -mt-0.5">Zero-Waste Native Engine</div>
        </div>
      </div>

      <!-- Live Server Status Capsules -->
      <div class="hidden md:flex items-center gap-2 ml-4 pl-4 border-l border-[var(--border)]">
        <!-- LLM Status -->
        <div class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-[var(--bg-elevated)] border border-[var(--border)] text-xs">
          <span class="relative flex h-2 w-2">
            <span id="llm-ping" class="hidden animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="llm-dot" class="relative inline-flex rounded-full h-2 w-2 bg-neutral-500"></span>
          </span>
          <span class="text-[var(--text-secondary)] font-medium">LLM:</span>
          <span id="header-model-name" class="font-mono text-[11px] font-semibold truncate max-w-[150px]">Offline</span>
        </div>

        <!-- SwarmUI Status -->
        <div class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-[var(--bg-elevated)] border border-[var(--border)] text-xs">
          <span class="relative flex h-2 w-2">
            <span id="swarm-dot" class="relative inline-flex rounded-full h-2 w-2 bg-neutral-500"></span>
          </span>
          <span class="text-[var(--text-secondary)] font-medium">SwarmUI:</span>
          <span id="header-swarm-status" class="font-mono text-[11px]">Offline</span>
        </div>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-2">
      <!-- Hardware Telemetry HUD -->
      <div class="hidden lg:flex items-center gap-3 px-3 py-1 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] text-[11px] font-mono">
        <div class="flex items-center gap-1.5" title="Dedicated VRAM">
          <i data-lucide="activity" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span class="text-[var(--text-muted)]">VRAM</span>
          <span id="hud-vram" class="font-semibold text-emerald-400">0%</span>
        </div>
        <div class="w-px h-3 bg-[var(--border)]"></div>
        <div class="flex items-center gap-1.5" title="System RAM">
          <i data-lucide="cpu" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span class="text-[var(--text-muted)]">RAM</span>
          <span id="hud-ram" class="font-semibold text-cyan-400">0%</span>
        </div>
        <div class="w-px h-3 bg-[var(--border)]"></div>
        <div class="flex items-center gap-1.5" title="CPU Load">
          <span class="text-[var(--text-muted)]">CPU</span>
          <span id="hud-cpu" class="font-semibold text-[var(--text-primary)]">0%</span>
        </div>
      </div>

      <!-- Quick Model Switcher Trigger -->
      <button id="btn-quick-model" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--bg-elevated)] hover:bg-[var(--border)] text-xs text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors shadow-sm" title="Quick Model Switcher (Ctrl+M)">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span class="hidden sm:inline font-medium">Models</span>
        <span class="hidden md:inline font-mono text-[9px] bg-[var(--bg-base)] px-1 rounded border border-[var(--border)]">^M</span>
      </button>

      <!-- Command Palette Trigger -->
      <button id="btn-cmd-palette" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--bg-elevated)] hover:bg-[var(--border)] text-xs text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors shadow-sm" title="Command Palette (Ctrl+K)">
        <i data-lucide="command" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span class="hidden md:inline font-mono text-[9px] bg-[var(--bg-base)] px-1 rounded border border-[var(--border)]">^K</span>
      </button>

      <!-- Language Selector -->
      <select id="lang-select" class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-xs text-[var(--text-primary)] outline-none cursor-pointer">
        <option value="en">EN</option>
        <option value="ar">العربية</option>
      </select>

      <!-- Theme Toggle -->
      <button id="theme-toggle" class="p-1.5 rounded-lg border border-[var(--border)] bg-[var(--bg-elevated)] hover:bg-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors" title="Toggle Theme">
        <i data-lucide="sun" class="w-4 h-4 text-amber-400 dark:block hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 text-indigo-400 block dark:hidden"></i>
      </button>
    </div>
  </header>

  <!-- App Body Layout (Sidebar Rail + Dynamic Main Content) -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Navigation Sidebar Rail -->
    <nav class="w-56 border-r border-[var(--border)] bg-[var(--bg-card)] flex flex-col justify-between p-3 shrink-0 z-10">
      <div class="space-y-1">
        <button class="nav-tab-btn active" data-target="tab-dashboard">
          <i data-lucide="gauge" class="w-4 h-4 text-emerald-400"></i>
          <span>Dashboard & Engine</span>
        </button>

        <!-- AI Chat Section with expandable sub-options -->
        <div class="nav-group space-y-1" id="nav-group-chat">
          <div class="flex items-center gap-1">
            <button class="nav-tab-btn flex-1 flex items-center justify-between" data-target="tab-chat" id="btn-nav-chat">
              <div class="flex items-center gap-2">
                <i data-lucide="message-square" class="w-4 h-4 text-cyan-400"></i>
                <span>AI Chat</span>
              </div>
            </button>
            <button id="btn-toggle-chat-sub" type="button" class="p-2 rounded-xl text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-all cursor-pointer shrink-0" title="Toggle Chat Options">
              <i data-lucide="chevron-down" id="chat-sub-chevron" class="w-3.5 h-3.5 transition-transform duration-200"></i>
            </button>
          </div>
          <div id="chat-sub-menu" class="hidden ml-3 pl-2.5 border-l border-[var(--border)] space-y-1 py-0.5 animate-in fade-in slide-in-from-top-1 duration-150">
            <button class="nav-sub-btn active" data-target="tab-chat" data-sub="studio">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-[var(--brand)]"></i>
              <span>Studio Chat</span>
            </button>
            <button class="nav-sub-btn" data-target="tab-llama-web" data-sub="web">
              <i data-lucide="globe" class="w-3.5 h-3.5 text-cyan-400"></i>
              <span>Llama Web UI</span>
            </button>
          </div>
        </div>

        <button class="nav-tab-btn" data-target="tab-models">
          <i data-lucide="hard-drive" class="w-4 h-4 text-indigo-400"></i>
          <span>Models Library</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-hub">
          <i data-lucide="cloud-download" class="w-4 h-4 text-amber-400"></i>
          <span>Model Hub</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-hardware">
          <i data-lucide="activity" class="w-4 h-4 text-rose-400"></i>
          <span>Hardware Monitor</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-tuning">
          <i data-lucide="sliders-horizontal" class="w-4 h-4 text-teal-400"></i>
          <span>Performance Tuning</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-api">
          <i data-lucide="code-2" class="w-4 h-4 text-violet-400"></i>
          <span>API Playground</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-swarm">
          <i data-lucide="palette" class="w-4 h-4 text-fuchsia-400"></i>
          <span>SwarmUI Studio</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-voice-studio">
          <svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>
          </svg>
          <span>Voice Studio</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-logs">
          <i data-lucide="terminal-square" class="w-4 h-4 text-emerald-400"></i>
          <span>Live Logs</span>
        </button>

        <button class="nav-tab-btn" data-target="tab-settings">
          <i data-lucide="settings" class="w-4 h-4 text-neutral-400"></i>
          <span>Settings & About</span>
        </button>
      </div>

      <!-- Bottom Fast Control Pill Box -->
      <div class="pt-3 border-t border-[var(--border)] flex flex-col gap-2 mt-auto">
        <!-- Start/Stop Engine Button -->
        <button id="btn-rail-toggle-server" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/25 text-xs font-semibold transition-all shadow-xs">
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
          <span id="btn-rail-server-text">Start LLM Server</span>
        </button>

        <!-- Start/Stop SwarmUI Button -->
        <button id="btn-rail-toggle-swarm" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-cyan-500/15 border border-cyan-500/30 text-cyan-400 hover:bg-cyan-500/25 text-xs font-semibold transition-all shadow-xs" title="Start or Stop SwarmUI">
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
          <span id="btn-rail-swarm-text">Start SwarmUI</span>
        </button>

        <div class="grid grid-cols-2 gap-1.5">
          <button id="btn-rail-flush" class="flex items-center justify-center gap-1.5 py-1.5 px-2 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] hover:border-emerald-500/40 text-[11px] text-[var(--text-secondary)] hover:text-emerald-400 transition-colors" title="Flush Context & KV Cache (0 tokens)">
            <i data-lucide="eraser" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Flush</span>
          </button>

          <button id="btn-rail-eject" class="flex items-center justify-center gap-1.5 py-1.5 px-2 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] hover:border-amber-500/40 text-[11px] text-[var(--text-secondary)] hover:text-amber-400 transition-colors" title="Unload models from GPU VRAM">
            <i data-lucide="log-out" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Eject</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content Area: Hosts Dynamically Loaded Tab Partials -->
    <main id="main-content" class="flex-1 bg-[var(--bg-base)] overflow-hidden relative flex flex-col min-h-0"></main>
  </div>

  <!-- Modals Container: Hosts Dynamically Loaded Modal Partials -->
  <div id="modals-container"></div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"></div>

  <!-- Application Bootstrap Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
